<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Arcade Player</title>
  <style>
    body{margin:0;background:#050d15;color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;height:100vh}
    .top-bar{height:48px;background:#0b1c2b;border-bottom:1px solid #1c3c58;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:10}
    .game-name{font-weight:900;color:#5ffff6;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
    .btn{padding:7px 11px;border-radius:8px;border:0;background:#1e5b87;color:#fff;font-weight:bold;cursor:pointer;font-size:11px;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
    .btn.like{background:#ff4757}
    .btn.fav{background:#f5a822;color:#331d04}
    .main-stage{flex:1;display:flex;justify-content:center;align-items:center;position:relative;background:#03080e}
    .game-frame-box{flex:1;height:100%;max-width:1440px;position:relative;isolation:isolate;background:radial-gradient(ellipse at 50% 0%,rgba(44,111,145,.15),transparent 60%);}
    .game-frame-box::before{content:'';position:absolute;inset:10px;border:1px solid rgba(95,255,246,.09);border-radius:12px;pointer-events:none;z-index:2;box-shadow:inset 0 0 30px rgba(95,255,246,.025)}
    iframe{width:100%;height:100%;border:0;display:block;background:#050d15}
    .top-bar{box-shadow:0 6px 24px rgba(0,0,0,.22);backdrop-filter:blur(16px)}
    .btn{transition:transform .16s ease,filter .16s ease,box-shadow .16s ease;border:1px solid rgba(160,220,245,.08)}
    .btn:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 6px 18px rgba(0,0,0,.22)}
    .modal-box{box-shadow:0 24px 70px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.05);backdrop-filter:blur(18px)}
    @media(prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}
    .modal{position:fixed;inset:0;background:rgba(2,6,10,.95);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
    .modal.active{display:flex}
    .modal-box{background:#0e2235;border:1.5px solid #5ffff6;border-radius:18px;padding:20px;max-width:400px;width:100%;text-align:center}
    .live-pause-screen{position:absolute;inset:0;background:#061019;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;text-align:center;padding:20px}
    @media(min-width:600px){.game-name{max-width:300px;font-size:16px}}
    @media(max-width:640px){
      body{height:100dvh}
      .top-bar{height:auto;min-height:48px;padding:7px 8px;gap:6px;align-items:center;flex-wrap:wrap}
      .top-bar>div{flex-wrap:wrap;gap:5px!important}
      .game-name{max-width:min(38vw,170px)}
      .btn{padding:6px 8px;font-size:10.5px}
      .game-frame-box::before{inset:4px;border-radius:8px}
    }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- ÉCRAN DE PAUSE EN DIRECT PAR L'ADMIN -->
  <div class="live-pause-screen" id="pause-screen">
    <div style="font-size:42px;margin-bottom:10px">⏸️</div>
    <h2 style="color:#5ffff6;margin:0 0 6px">Jeu Mis en Pause</h2>
    <p style="color:#a0c0d4;font-size:13px;max-width:340px">L'administrateur a temporairement mis ce jeu en maintenance. Vos progrès ont été sauvegardés.</p>
    <a href="/" class="btn" style="margin-top:12px;padding:9px 18px">Retourner au Portail</a>
  </div>

  <!-- BARRE SUPÉRIEURE DE CONTRÔLE -->
  <div class="top-bar">
    <div style="display:flex;align-items:center;gap:8px">
      <a href="/" class="btn">⬅ Quitter</a>
      <span class="game-name" id="game-title">Jeu</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <button class="btn like" onclick="likeGame()">❤️ <span id="like-count">0</span></button>
      <button class="btn fav" onclick="toggleFavorite()">⭐</button>
      <button class="btn" onclick="openReviewModal()">✍️ Noter</button>
      <button class="btn" onclick="openBugModal()">🐛</button>
      <button class="btn" onclick="toggleFullscreen()">⛶</button>
    </div>
  </div>

  <!-- ZONE DE JEU -->
  <div class="main-stage">
    <div class="game-frame-box">
      <iframe id="game-iframe" src="about:blank"></iframe>
    </div>
  </div>

  <!-- MODALE D'AVIS PRIVÉ POUR L'ADMIN -->
  <div class="modal" id="review-modal">
    <div class="modal-box">
      <h3>Donner une note & avis privé</h3>
      <p style="font-size:11px;color:#8eb1c7">Visible uniquement par l'administrateur pour améliorer le jeu.</p>
      <select id="rev-rating" style="width:100%;padding:10px;background:#050f18;color:#fff;border-radius:8px;border:1px solid #1c3c58;margin-bottom:10px">
        <option value="5">⭐⭐⭐⭐⭐ (5/5 Excellent)</option>
        <option value="4">⭐⭐⭐⭐ (4/5 Très bon)</option>
        <option value="3">⭐⭐⭐ (3/5 Moyen)</option>
        <option value="2">⭐⭐ (2/5 Décevant)</option>
        <option value="1">⭐ (1/5 Mauvais)</option>
      </select>
      <textarea id="rev-comment" rows="3" placeholder="Écrivez un commentaire constructif..." style="width:100%;padding:10px;background:#050f18;color:#fff;border-radius:8px;border:1px solid #1c3c58;box-sizing:border-box;margin-bottom:12px"></textarea>
      <button class="btn" style="background:#23c4a2;color:#032924;width:100%;padding:10px;font-weight:900" onclick="submitReview()">Envoyer mon avis</button>
      <button class="btn" style="background:none;margin-top:6px;width:100%" onclick="closeModal('review-modal')">Fermer</button>
    </div>
  </div>

  <!-- MODALE SIGNALER UN BUG -->
  <div class="modal" id="bug-modal">
    <div class="modal-box">
      <h3>🐛 Signaler un Bug</h3>
      <textarea id="bug-desc" rows="3" placeholder="Expliquez ce qui ne va pas..." style="width:100%;padding:10px;background:#050f18;color:#fff;border-radius:8px;border:1px solid #1c3c58;box-sizing:border-box;margin-bottom:12px"></textarea>
      <button class="btn" style="background:#e02447;width:100%;padding:10px;font-weight:900" onclick="submitBug()">Envoyer le rapport</button>
      <button class="btn" style="background:none;margin-top:6px;width:100%" onclick="closeModal('bug-modal')">Fermer</button>
    </div>
  </div>

  <script src="/arcade-sdk.js"></script>
  <script>
    const socket = io();
    const params = new URLSearchParams(location.search);
    const gameUrl = params.get('url');
    const gameTitle = params.get('title') || 'Jeu';
    const gameId = params.get('id');

    document.getElementById('game-title').textContent = gameTitle;
    let myIP = null;
    if (gameUrl) {
      document.getElementById('game-iframe').src = gameUrl;
      // Un HTML importé reçoit déjà Arcade.init(gameId) à l'intérieur de l'iframe.
      // N'initialise ici que les jeux externes pour éviter de compter deux sessions.
      const isPortalUploadedGame = /^\/games\/[a-z0-9-]+\/?(?:[?#].*)?$/i.test(gameUrl);
      if (!isPortalUploadedGame && window.Arcade) window.Arcade.init(gameId);
    }

    fetch('/api/player/me', { cache: 'no-store' }).then(r => r.json()).then(data => { myIP = data.ip || null; }).catch(() => {});

    // Un freeze doit toucher uniquement le visiteur dont l'adresse correspond.
    socket.on('player:freeze_status', (data) => {
      if (!data || !myIP || data.ip !== myIP) return;
      const frame = document.getElementById('game-iframe');
      if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage({ type: 'ARCADE_FREEZE', frozen: data.frozen }, '*');
      }
    });

    // Réception des alertes d'urgence en direct
    socket.on('broadcast:alert', (data) => {
      alert("🚨 ALERTE DU SERVEUR :\n" + data.message);
    });

    // Mise en pause instantanée si l'admin clique sur pause
    socket.on('game:status_changed', (data) => {
      if (data.id === gameId) {
        document.getElementById('pause-screen').style.display = (data.status === 'paused') ? 'flex' : 'none';
      }
    });

    // Bannissement en direct
    socket.on('banned', (data) => {
      document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#050a10;color:#ff6b6b;font-family:sans-serif;text-align:center;padding:20px"><h1>🚫 ACCÈS BANNI</h1><p>${data.reason}</p></div>`;
    });

    // Compteur de temps de jeu & XP automatique
    setInterval(() => {
      fetch('/api/player/heartbeat', { method: 'POST' }).catch(() => {});
    }, 60000);

    async function likeGame(){
      if (!gameId) return;
      const res = await fetch('/api/games/' + encodeURIComponent(gameId) + '/like', { method: 'POST' });
      const data = await res.json();
      if (data.success) document.getElementById('like-count').textContent = data.likes;
    }

    async function toggleFavorite(){
      if (!gameId) return;
      await fetch('/api/games/' + encodeURIComponent(gameId) + '/favorite', { method: 'POST' });
      alert("Favoris mis à jour !");
    }

    function openReviewModal(){ document.getElementById('review-modal').classList.add('active'); }
    function openBugModal(){ document.getElementById('bug-modal').classList.add('active'); }
    function closeModal(id){ document.getElementById(id).classList.remove('active'); }

    async function submitReview(){
      const rating = document.getElementById('rev-rating').value;
      const comment = document.getElementById('rev-comment').value.trim();
      await fetch('/api/games/' + encodeURIComponent(gameId) + '/review', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rating, comment })
      });
      alert("Avis envoyé à l'administrateur !");
      closeModal('review-modal');
    }

    async function submitBug(){
      const desc = document.getElementById('bug-desc').value.trim();
      if (!desc) return;
      await fetch('/api/bugs/report', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ gameTitle, description: desc })
      });
      alert("Rapport envoyé à l'équipe !");
      closeModal('bug-modal');
    }

    function toggleFullscreen(){
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen().catch(() => {});
    }
  </script>
</body>
</html>
